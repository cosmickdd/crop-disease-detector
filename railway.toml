# ──────────────────────────────────────────────────────────────────────────────
# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code
#
# Push this repo to GitHub, connect it in Railway, and it will:
#   1. Build the Docker image from ./Dockerfile
#   2. Set PORT automatically and pass it to the container
#   3. Run health checks against /api/v1/health
# ──────────────────────────────────────────────────────────────────────────────

[build]
builder      = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT; our CMD uses ${PORT:-8000} to pick it up.
healthcheckPath    = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 3
