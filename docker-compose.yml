version: "3.9"

services:
  # ─────────────────────────────────────────────
  # Main inference API
  # ─────────────────────────────────────────────
  crop-disease-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: krishi-ai/crop-disease-detector:latest
    container_name: crop-disease-api
    ports:
      - "8000:8000"
    volumes:
      # Mount trained model and data directories from host
      - ./models:/app/models:ro
      - ./logs:/app/logs:rw
    environment:
      - MODEL_ARCH=mobilenet_v3_large
      - DEVICE=auto
      - CONFIDENCE_THRESHOLD=0.50
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - NUM_WORKERS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # Nginx reverse proxy (optional — uncomment for production)
  # ─────────────────────────────────────────────
  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: crop-disease-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - crop-disease-api
  #   restart: unless-stopped

networks:
  default:
    name: krishi-ai-network
